- titulo: "App Hubros (Plataforma de Coworking)"
  descricao: "Aplicativo nativo para iOS desenvolvido com SwiftUI e backend serverless via AWS Amplify. O app é uma plataforma de coworking com reservas, pagamentos e QR Code. Além do backend, projetei e implementei uma arquitetura de dados Lake House com Dashboards para acompanhamento analítico dos KRs e KPIs do produto. O projeto tem consolidado minhas habilidades em arquitetura Cloud-native, engenharia de software e engenharia de dados."
  status: "andamento"
