- titulo: "App Hubros (Plataforma de Coworking)"
  descricao: "Aplicativo nativo para iOS desenvolvido com SwiftUI e backend serverless via AWS Amplify. Trata-se de uma plataforma completa de coworking com fluxo de reservas, pagamentos, check-in via QR Code, painel de perfil e sistema de convites. O projeto tem consolidado minhas habilidades em arquitetura de software, desenvolvimento Mobile e integrações Cloud-native na AWS."
