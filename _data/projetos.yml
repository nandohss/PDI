- titulo: "Mentoria e Onboarding"
  descricao: "Realização de mentoria, onboarding e engajamento dos estagiários com a plataforma de treinamentos IU Mentoria."
  status: "concluido"
- titulo: "Migração para Data Mesh (ServiceNow)"
  descricao: "Desmobilização de plataforma de dados On-Premises e Democratização dos dados de ITSM (Plataforma Service Now) no Data Mesh."
  status: "concluido"
- titulo: "Tracing do FinOps Agent"
  descricao: "Democratização dos dados de KPIs e Tracing do FinOps Agent. No primeiro ano, o produto rendeu R$ 10 milhões em redução financeira de infraestrutura AWS. Esta contribuição me rendeu o prêmio PRAD (Programa de Reconhecimento de Alto Desempenho) em 2025 (ciclo 2024)."
  status: "concluido"
- titulo: "Alertas Datadog Monitors"
  descricao: "Projeto em 2025 com foco na ingestão e processamento de dados do monitor de alertas do Datadog Monitors. A solução democratizou esses dados de observabilidade no Data Mesh do banco."
  status: "concluido"
- titulo: "Sprint FinOps - Otimização AWS S3 e Small Files"
  descricao: "No final de 2025, atuei em uma sprint de FinOps com o objetivo de reduzir os custos de armazenamento S3 nas contas dos Cientistas de Dados. Implementei políticas de versionamento e Life Cycle e criei um processo de compactação para correção do problema de 'small files' em diversas bases de modelos."
  status: "concluido"
- titulo: "Recorrência de Incidentes"
  descricao: "No início de 2026, atuei na engenharia de dados de um modelo focado em analisar e clusterizar a recorrência de incidentes. Fui o responsável pela ingestão de dados, por alimentar o modelo e por democratizar as tabelas resultantes na camada SPEC do banco."
  status: "concluido"
- titulo: "Modelo de Resiliência Aplicacional (GenAI)"
  descricao: "Projeto em 2026 envolvendo um modelo de IA Generativa (ChatGPT OSS) que analisa via repositório a resiliência das aplicações AWS do banco. Fui responsável pela engenharia e ingestão dos dados de output do modelo, democratizando-os no ambiente Data Mesh."
  status: "concluido"
- titulo: "ETL IMO (Identificação de Mudanças Ofensoras)"
  descricao: "Atualmente (Junho/2026) na reta final da ingestão de dados para a nova versão do ETL do modelo IMO. Este desafio envolve processamento de alta volumetria (mais de 100 milhões de registros por dia). A nova solução tem o grande objetivo de reduzir os custos operacionais de R$ 150 mil/mês para cerca de R$ 3 mil/mês."
  status: "andamento"
