<!DOCTYPE html>
<html lang="pt-BR">
{% include head.html %}
<body>
    <div id="bg-glow"></div>

    <header>
        <div class="container">
            <img src="{{ '/assets/images/eu.jpeg' | relative_url }}" alt="Minha Foto" class="profile-img">
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
            
            <div class="btn-container">
                <a href="https://linkedin.com/in/fernando-sousa-silva-69092016a" target="_blank" class="btn">LinkedIn</a>
                <a href="https://github.com/nandohss" target="_blank" class="btn">GitHub</a>
                <a href="mailto:fernando98sousaa@gmail.com" class="btn">Email Pessoal</a>
                <a href="mailto:fernando.sousa-silva@itau-unibanco.com.br" class="btn">Email Corporativo</a>
            </div>
        </div>
    </header>
    
    <main class="container">
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Feito com Jekyll & Vanilla CSS.</p>
    </footer>
    
    <script>
        // Efeito de brilho que segue o mouse
        const glow = document.getElementById('bg-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
